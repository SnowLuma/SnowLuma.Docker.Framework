name: docker-publish

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      image:
        description: Docker image name, for example docker.io/example/snowluma
        required: true
        default: ""
      tag:
        description: Docker image tag
        required: true
        default: ""
      push:
        description: Push image after build
        required: true
        type: boolean
        default: false
      platforms:
        description: Docker target platforms
        required: true
        default: "linux/amd64,linux/arm64"
      snowluma_tag:
        description: SnowLuma release tag whose artifact should be baked in (defaults to `tag`). Can also be a branch-based release tag like `dev` if available.
        required: false
        default: ""
      snowluma_branch:
        description: SnowLuma source branch to use. If provided, will try to fetch artifacts from this branch. Ignored if snowluma_tag is set.
        required: false
        default: ""
      snowluma_repository:
        description: SnowLuma source repository in `owner/repo` form. Leave blank to fall back to the checked-in SnowLuma.Framework.tar.gz.
        required: false
        default: "SnowLuma/SnowLuma"

jobs:
  resolve:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Resolve target platforms
        id: matrix
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          set -eu
          matrix='{"include":['
          separator=''
          case ",${PLATFORMS}," in
            *",linux/amd64,"*)
              matrix="${matrix}${separator}{\"arch\":\"amd64\",\"platform\":\"linux/amd64\",\"os\":\"ubuntu-22.04\"}"
              separator=','
              ;;
          esac
          case ",${PLATFORMS}," in
            *",linux/arm64,"*)
              matrix="${matrix}${separator}{\"arch\":\"arm64\",\"platform\":\"linux/arm64\",\"os\":\"ubuntu-22.04-arm\"}"
              separator=','
              ;;
          esac
          matrix="${matrix}]}"
          if [ "${matrix}" = '{"include":[]}' ]; then
            echo "No supported platforms selected. Use linux/amd64, linux/arm64, or both." >&2
            exit 1
          fi
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"

  build:
    needs: resolve
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.resolve.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    environment: SnowLuma
    steps:
      - name: Checkout Docker framework
        uses: actions/checkout@v6

      # Pull the per-arch lite tarball from SnowLuma's GitHub release.
      # `gh release download` waits for the asset to be ready, retries on
      # transient failures, and fails loudly with a precise error if the
      # tag/asset is missing. The Dockerfile itself runs the final
      # arch-specific presence test inside the build context.
      - name: Download SnowLuma release artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SNOWLUMA_REPO: ${{ inputs.snowluma_repository }}
          SNOWLUMA_TAG: ${{ inputs.snowluma_tag }}
          SNOWLUMA_BRANCH: ${{ inputs.snowluma_branch }}
          DEFAULT_TAG: ${{ inputs.tag }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          case "${ARCH}" in
            amd64) asset_arch="linux-x64" ;;
            arm64) asset_arch="linux-arm64" ;;
            *) echo "Unsupported matrix arch: ${ARCH}" >&2; exit 1 ;;
          esac
          
          # Determine which reference to use: snowluma_tag > snowluma_branch > tag
          ref=""
          if [ -n "${SNOWLUMA_TAG}" ]; then
            ref="${SNOWLUMA_TAG}"
          elif [ -n "${SNOWLUMA_BRANCH}" ]; then
            ref="${SNOWLUMA_BRANCH}"
          else
            ref="${DEFAULT_TAG}"
          fi
          if [ -z "${ref}" ]; then
            echo "No reference found. Either tag or snowluma_branch must be provided." >&2
            exit 1
          fi
          
          asset="SnowLuma-${ref}-${asset_arch}-lite.tar.gz"
          echo "Fetching ${asset} from ${SNOWLUMA_REPO}@${ref}"
          gh release download "${ref}" \
            --repo "${SNOWLUMA_REPO}" \
            --pattern "${asset}" \
            --output SnowLuma.Framework.tar.gz \
            --clobber
          ls -lh SnowLuma.Framework.tar.gz

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: ${{ inputs.push }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image
        env:
          IMAGE: ${{ inputs.image }}
          TAG: ${{ inputs.tag }}
          PUSH: ${{ inputs.push }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -eu
          if [ -z "${IMAGE}" ]; then
            echo "workflow input image is required"
            exit 1
          fi
          if [ -z "${TAG}" ]; then
            echo "workflow input tag is required"
            exit 1
          fi
          if [ "${PUSH}" = "true" ]; then
            docker buildx build \
              --platform "${PLATFORM}" \
              --tag "${IMAGE}" \
              --file ./Dockerfile \
              --output "type=image,push-by-digest=true,name-canonical=true,push=true" \
              --metadata-file metadata.json \
              .
            digest="$(jq -r '."containerimage.digest"' metadata.json)"
            if [ -z "${digest}" ] || [ "${digest}" = "null" ]; then
              echo "Unable to resolve pushed image digest" >&2
              cat metadata.json >&2
              exit 1
            fi
            mkdir -p digests
            touch "digests/${digest#sha256:}"
          else
            docker buildx build \
              --platform "${PLATFORM}" \
              --tag "${IMAGE}:${TAG}" \
              --file ./Dockerfile \
              --load \
              .
          fi

      - name: Upload Docker image digest
        if: ${{ inputs.push }}
        uses: actions/upload-artifact@v7
        with:
          name: docker-digest-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

      - name: Docker logout
        if: ${{ always() && inputs.push }}
        run: docker logout || true

  merge:
    if: ${{ inputs.push }}
    needs:
      - resolve
      - build
    runs-on: ubuntu-22.04
    environment: SnowLuma
    steps:
      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Download Docker image digests
        uses: actions/download-artifact@v7
        with:
          pattern: docker-digest-*
          path: digests
          merge-multiple: true

      - name: Create Docker manifest
        run: |
          set -euo pipefail
          image="${{ inputs.image }}"
          tag="${{ inputs.tag }}"
          cd digests
          shopt -s nullglob
          digest_files=(*)
          if [ "${#digest_files[@]}" -eq 0 ]; then
            echo "No Docker image digests were produced" >&2
            exit 1
          fi
          refs=()
          for digest in "${digest_files[@]}"; do
            refs+=("${image}@sha256:${digest}")
          done
          tags=(--tag "${image}:${tag}")
          if [ "${tag}" != "latest" ]; then
            tags+=(--tag "${image}:latest")
          fi
          docker buildx imagetools create "${tags[@]}" "${refs[@]}"
          docker buildx imagetools inspect "${image}:${tag}"

      - name: Docker logout
        if: always()
        run: docker logout || true
